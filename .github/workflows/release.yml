# 自动发布：推送 v* 格式的 tag（如 v1.1.0）时触发。
# 在 Windows / macOS 上分别打包，然后把安装包上传到该 tag 对应的 GitHub Release。
# 无需配置任何 secret——GITHUB_TOKEN 由 Actions 自动注入。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            files: |
              dist/*.exe
              dist/*.zip
          - os: macos-latest
            script: build:mac
            files: |
              dist/*.dmg
              dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Verify release metadata
        run: >-
          node -e "const fs = require('node:fs');
          const expectedTag = 'v' + require('./package.json').version;
          if (process.env.GITHUB_REF_NAME !== expectedTag) { throw new Error('Release tag ' + process.env.GITHUB_REF_NAME + ' does not match package version ' + expectedTag + '.'); }
          const notesPath = '.github/release-notes/' + expectedTag + '.md';
          if (!fs.existsSync(notesPath) || !fs.readFileSync(notesPath, 'utf8').trim()) { throw new Error('Release notes are missing or empty: ' + notesPath); }"

      - run: npm ci

      - run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release-assets/*
          name: Goof Off ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
