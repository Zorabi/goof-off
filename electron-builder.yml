appId: com.cl.goof-off-app
productName: Goof Off
directories:
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  - LICENSE
  # Renderer dependencies are bundled by Vite and electron-store is bundled into
  # the main process. Keep only modules that remain external at runtime.
  - '!node_modules/**'
  - node_modules/@electron-toolkit/utils/**
  - node_modules/iconv-lite/**
  - node_modules/jschardet/**
  - node_modules/safer-buffer/**
  - '!**/.DS_Store'
  - '!src/**'
  - '!logs/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.idea,.vscode}/**'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
win:
  executableName: goof-off-app
  artifactName: Goof-Off-${version}-Portable.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  artifactName: Goof-Off-${version}-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  artifactName: Goof-Off-${version}-mac.${ext}
  category: public.app-category.utilities
  identity: '-'
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: Goof-Off-${version}-mac.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
